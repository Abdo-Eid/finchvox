[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finchvox-livekit-example"
version = "0.1.0"
description = "LiveKit agent example with Finchvox telemetry"
requires-python = ">=3.10, <3.15"

dependencies = [
    "python-dotenv",
    "finchvox[livekit]",
]

[tool.uv.sources]
finchvox = { path = "../..", editable = true }
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
